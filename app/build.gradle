plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diginika.companion'
    compileSdk 34

    defaultConfig {
        applicationId "com.diginika.companion"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // A fixed key is committed on purpose: every build is signed the same way, so a new
    // APK installs over the old one. It is a hobby sideload key, not a secret.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
